name: terraform-ci

permissions:
  contents: read
  security-events: write


on: 
  push: 
    branches:
      - dev
      - staging
      - main
  pull_request:
    branches:
      - dev
      - staging
      - main
jobs: 
  gitleaks-scan:
    runs-on: ubuntu-latest    
    steps: 
      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
          | tar -xz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks (filesystem scan)
        run: |
          gitleaks detect \
          --source . \
          --no-git \
          --redact \
          --exit-code 1
  
  semgrep-scan:
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep Scan
        uses: r7kamura/semgrepper@v0
        
      
    

      
 
      
  
  terraform-ci: 
    runs-on: ubuntu-latest
    needs: semgrep-scan
    steps: 
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup terraform 
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.6.6"

    - name: Setup environment folder
      run: |
        if [[ "$GITHUB_REF_NAME" == "dev" ]]; then 
          echo "DIR=environments/dev" >> $GITHUB_ENV
        elif [[ "$GITHUB_REF_NAME" = "staging" ]]; then 
          echo "DIR=environments/staging" >> $GITHUB_ENV
        else 
          echo "DIR=environments/prod" >> $GITHUB_ENV
        fi


    - name: Terraform init
      run: |
        cd $DIR 
        terraform init -input=false

    - name: Terraform Format
      run: | 
        cd $DIR
        terraform fmt 
    
    - name: Terraform validate
      run: |
        cd $DIR
        terraform validate
    

  checkov: 
    name: Checkov Scan
    runs-on: ubuntu-latest 
    needs: terraform-ci
    steps: 
      - name: Checkout
        uses: actions/checkout@v4
      

      - name: Setup environment folder
        run: |
          if [[ "$GITHUB_REF_NAME" = "dev" ]]; then 
            echo "DIR=environments/dev" >> $GITHUB_ENV
          elif [[ "$GITHUB_REF_NAME" = "staging" ]]; then 
            echo "DIR=environments/staging" >> $GITHUB_ENV
          else 
            echo "DIR=environments/prod" >> $GITHUB_ENV
          fi
      - name: Checkov GitHub Action
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.DIR }}
          output_format: cli,sarif
          output_file_path: console,results.sarif
          soft_fail: true

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: results.sarif
          
  tfsec:
    name: tfsec
    runs-on: ubuntu-latest
    needs: checkov
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup terraform 
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"
      
      - name: Setup environment folder
        run: |
          if [[ "$GITHUB_REF_NAME" = "dev" ]]; then 
            echo "DIR=environments/dev" >> $GITHUB_ENV
          elif [[ "$GITHUB_REF_NAME" = "staging" ]]; then 
            echo "DIR=environments/staging" >> $GITHUB_ENV
          else 
            echo "DIR=environments/prod" >> $GITHUB_ENV
          fi

      
      - name: Terraform security scan
        uses: aquasecurity/tfsec-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
        with:
          working_directory: ${{ env.DIR }}
          soft_fail: true
  
  terraform-plan:
    runs-on: ubuntu-latest
    needs: tfsec
    steps:
    - uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.6.6"

    - name: Set environment folder
      run: |
        if [[ "$GITHUB_REF_NAME" == "dev" ]]; then
          echo "DIR=environments/dev" >> $GITHUB_ENV
        elif [[ "$GITHUB_REF_NAME" == "staging" ]]; then
          echo "DIR=environments/staging" >> $GITHUB_ENV
        else
          echo "DIR=environments/prod" >> $GITHUB_ENV
        fi
    - name: Install AWS CLI
      run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          sudo apt install unzip -y
          unzip awscliv2.zip
          sudo ./aws/install --update
      
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v5.1.1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Terraform Init
      run: |
        cd $DIR
        terraform init -input=false

    - name: Terraform Plan
      run: |
        cd $DIR
        terraform plan -out=tfplan
    
    - name: Run Infracost
      uses: infracost/actions/setup@v2
      with:
        api-key: ${{ secrets.INFRACOST_API_KEY }}

    - name: Generate Infracost diff
      run: |
        cd environments/dev
        
        infracost breakdown --path . \
          --format table \
          --out-file cost-estimate.txt
    
    - name: Output cost estimate
      run: cat environments/dev/cost-estimate.txt
  